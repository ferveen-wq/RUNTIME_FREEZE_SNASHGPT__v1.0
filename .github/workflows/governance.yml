name: SNASH Governance CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  governance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Runtime Guardian
        run: |
          python tools/runtime_guardian.py

      - name: Run Active Rollout Guard
        run: |
          python tools/audit/active_rollout_guard.py


      - name: Run Governance Pipeline
        run: |
          python runner/governance_pipeline.py
