name: Runtime Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  runtime-checks:
    runs-on: ubuntu-latest

    steps:
  - name: Checkout repository
    uses: actions/checkout@v3

  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: pip install -r requirements.txt || true

  - name: Validate phrase library
    run: python runner/phrase_library_validator.py

  - name: Phrase governance scan
    run: python tools/governance_phrase_scan.py

  - name: Phrase library lock check
    run: python tools/phrase_library_lock.py

  - name: Phrase diff visualization
    run: python tools/phrase_diff_visualizer.py

  - name: Phrase coverage heatmap
    run: python tools/phrase_coverage_heatmap.py
