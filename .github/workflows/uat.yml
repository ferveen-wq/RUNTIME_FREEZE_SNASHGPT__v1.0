name: UAT Runner

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  uat:
    runs-on: ubuntu-latest
    env:
      # Job-level env so ALL steps (including python) can read it.
      # Note: Secrets are not available to forked PRs; they are available on push and workflow_dispatch.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OPENAI_API_KEY presence (safe)
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY is missing in CI env. Ensure repo secret OPENAI_API_KEY exists and workflow trigger has secret access."
            exit 1
          fi
          echo "OPENAI_API_KEY is present (length=${#OPENAI_API_KEY})."

      - name: Run UAT
        shell: bash
        run: |
          python runner/run_uat.py

      - name: Run Phase 3A qualifier regression pack
        shell: bash
        run: |
          UAT_CASES_FILE=tests/regression_phase3a_qualifier.json python runner/run_uat.py

      - name: Upload UAT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-reports
          path: tests/reports/*.json